name: Deploy Evaluation Reports to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "evaluaciones/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evaluaciones
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            evaluaciones
      - name: Prepare static site directory
        run: |
          mkdir -p _site/evaluaciones
          cp evaluaciones/*.html _site/evaluaciones/
          cp evaluaciones/*.html _site/
          cp evaluaciones/reporte_final_interactivo_split_brain.html _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
