<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre · Qué corre dónde</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sobre · Artículo</p>
    <h1>Todo pasa por el revisor antes de llegar a Gemini</h1>

    <svg viewBox="0 40 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emily-arquitectura-articulo-title emily-arquitectura-articulo-desc">
      <title id="emily-arquitectura-articulo-title">Qué corre dónde en Sobre</title>
      <desc id="emily-arquitectura-articulo-desc">En tu navegador corren las reglas de la nota, un revisor que tacha lo privado y, si lo descargaste, un modelo pequeño; solo el perfil tachado llega a Gemini, que escribe la carta.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect x="0" y="40" width="960" height="540" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="24" y="64" width="416" height="424" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="68" width="74" height="12" rx="2" fill="#f5f5f5"/>
      <text x="77" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TU NAVEGADOR</text>

      <rect x="784" y="224" width="160" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="800" y="228" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="824" y="237" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GOOGLE</text>

      <!-- Arrows -->
      <path d="M 168,196 H 184 Q 192,196 192,188 V 136 Q 192,128 200,128 H 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 168,212 H 196 Q 204,212 204,220 V 280 Q 204,288 210,288 H 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 168,228 H 180 Q 188,228 188,236 V 400 Q 188,408 196,408 H 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="288" x2="798" y2="288" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      
      <!-- Arrow labels -->
      <rect x="200" y="334" width="91" height="12" rx="2" fill="#f5f5f5"/>
      <text x="246" y="343" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERFIL COMPLETO</text>
      <rect x="557" y="264" width="86" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="273" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERFIL TACHADO</text>

      <!-- Node: Persona -->
      <rect x="40" y="176" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="176" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="104" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tú</text>
      <text x="104" y="224" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">tu perfil y tu salario</text>

      <!-- Node: Reglas -->
      <rect x="216" y="96" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="316" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reglas fijas</text>
      <text x="316" y="144" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nota privada · carta base</text>

      <!-- Node: Router (focal) -->
      <rect x="216" y="256" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="256" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="316" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Revisor</text>
      <text x="316" y="304" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">tacha lo privado antes de enviar</text>

      <!-- Node: Modelo local -->
      <rect x="216" y="376" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="376" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="316" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Modelo pequeño</text>
      <text x="316" y="424" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">carta sin internet (opcional)</text>

      <!-- Node: Gemini -->
      <rect x="800" y="256" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="256" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="864" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gemini</text>
      <text x="864" y="304" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">escribe la carta</text>

      <!-- Editorial aside -->
      <text x="40" y="472" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Sin internet: la nota, una carta base y, si lo descargaste, el modelo pequeño.</text>

      <!-- Legend -->
      <line x1="24" y1="516" x2="936" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
      <rect x="24" y="548" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="44" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decide qué sale</text>
      <rect x="160" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Corre en tu navegador</text>
      <rect x="320" y="548" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="340" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Servicio de Google</text>
      <line x1="480" y1="554" x2="508" y2="554" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="516" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Lo único que sale</text>
    </svg>
  </div>
</body>
</html>
